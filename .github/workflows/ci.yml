name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet Linux daemon
        run: go vet ./...
      - name: Test Linux daemon
        run: go test -race -timeout 15m -count=1 ./...
      - name: Test SMTP settings
        run: node --test tests/js/smtp-events-test.cjs

  ci-ok:
    name: CI OK
    if: always()
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - name: Linux checks passed
        env:
          RESULT: ${{ needs.linux.result }}
        run: test "$RESULT" = success
