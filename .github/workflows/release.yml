name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example fork-v1.0.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  image:
    uses: ./.github/workflows/fork-image.yml
    with:
      ref: ${{ inputs.tag }}
      release_artifact: true
    secrets: inherit

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: onwatch-linux-amd64
          path: dist
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cd dist
          sha256sum onwatch-linux-amd64 > SHA256SUMS
          cd ..
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'Linux AMD64 fork build.\n\nContainer: `%s@%s`\n\nGuides: [Codex setup](https://github.com/%s/blob/%s/docs/CODEX_SETUP.md), [dashboard and image delivery](https://github.com/%s/blob/%s/docs/FORK_UI.md).\n' "$image" "$IMAGE_DIGEST" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" > notes.md
          if [ -f docs/FORK_RELEASE_NOTES.md ]; then cat docs/FORK_RELEASE_NOTES.md >> notes.md; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --title "onWatch $RELEASE_TAG" --notes-file notes.md
          fi
