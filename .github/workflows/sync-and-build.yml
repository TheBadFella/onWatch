name: Sync Upstream & Build

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the current main commit'
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - '**/*_test.go'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/sync-and-build.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream and select image builds
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- VERSION; then
                echo "build=true" >> "$GITHUB_OUTPUT"
              else
                status=$?
                if [ "$status" != 1 ]; then exit "$status"; fi
                echo "The Release workflow builds the image for a VERSION bump."
              fi
              ;;
            schedule|workflow_dispatch)
              git fetch --no-tags https://github.com/onllm-dev/onWatch.git refs/heads/main
              behind=$(git rev-list --count HEAD..FETCH_HEAD)
              if [ "$behind" -gt 0 ]; then
                echo "::warning::Fork is $behind commits behind upstream. Merge upstream/main and run the checks before publishing a release."
                echo "Fork is $behind commits behind upstream. Merge upstream/main before the next release." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
              fi
              if [ "$FORCE_BUILD" = true ]; then
                echo "build=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    uses: ./.github/workflows/fork-image.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
