name: Sync Upstream & Build

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force Docker build even if no upstream changes'
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/onllm-dev/onWatch.git || true
          git fetch upstream main

          BEHIND_COUNT=$(git rev-list HEAD..upstream/main --count)
          echo "Commits behind upstream: $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "Merging upstream changes..."
            git merge upstream/main --no-edit -m "chore(sync): merge upstream onllm-dev/onWatch updates"
            git push origin main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date with upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: |
      always() &&
      (github.event_name == 'push' ||
       needs.sync.outputs.has_changes == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_build == true))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and version
        id: prep
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${LOWER_REPO}" >> "$GITHUB_OUTPUT"

          VERSION="dev"
          if [ -f VERSION ] && [ -s VERSION ]; then
            VERSION="$(cat VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=alpine
            type=raw,value=${{ steps.prep.outputs.version }}

      - name: Build and push Docker image (Alpine runtime-shell, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-shell
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=onwatch-amd64
          cache-to: type=gha,mode=max,scope=onwatch-amd64
