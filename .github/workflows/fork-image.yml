name: Build fork image

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release_artifact:
        type: boolean
        default: false
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

concurrency:
  group: onwatch-fork-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test dashboard controls
        run: node --test tests/js/*-test.cjs
      - name: Build cached Linux binary
        id: source
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          sha=$(git rev-parse HEAD)
          version=$(cat VERSION)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf '%s+fork.%s\n' "$version" "${sha:0:7}" > VERSION
          bash ./app.sh --build
          mkdir -p dist
          mv onwatch dist/onwatch-linux-amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Alpine image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile.fork
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.source.outputs.image }}:alpine
            ${{ steps.source.outputs.image }}:latest
            ${{ steps.source.outputs.image }}:${{ steps.source.outputs.version }}
            ${{ steps.source.outputs.image }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=onwatch-fork-runtime
          cache-to: type=gha,mode=max,scope=onwatch-fork-runtime
      - uses: actions/upload-artifact@v4
        if: inputs.release_artifact
        with:
          name: onwatch-linux-amd64
          path: dist/onwatch-linux-amd64
