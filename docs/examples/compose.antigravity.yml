# Apply after the existing Compose file.
services:
  onwatch:
    image: ghcr.io/thebadfella/onwatch:1.0.5
    environment:
      ANTIGRAVITY_ENABLED: "true"
      ANTIGRAVITY_SOURCE: cli
      ANTIGRAVITY_CLI_PATH: /usr/local/bin/agy
      HOME: /data/antigravity
      # Clear the old IDE bridge configuration inherited from the base file.
      ANTIGRAVITY_BASE_URL: ""
      ANTIGRAVITY_CSRF_TOKEN: ""
